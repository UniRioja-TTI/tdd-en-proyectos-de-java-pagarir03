name: Generar Javadoc y Publicar en Pages

on:
  push:
    branches:
      - stable

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generar Javadoc
        run: javadoc -d ./docs src/*.java || javadoc -d ./docs src/main/java/com/tt1/test/*.java

      - name: Subir a GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

  deploy:
    needs: build-docs
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en Pages
        id: deployment
        uses: actions/deploy-pages@v4